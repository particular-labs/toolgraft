name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commits:check
        env:
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:browser
      - run: pnpm registry:verify
      - run: node scripts/check-immutable.mts
        env:
          IMMUTABLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
